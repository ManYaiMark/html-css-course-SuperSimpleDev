<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="header.css">
    </head>
    <body>
        <div class="header">
            <div class="left-section">
                <img class="hamburger-menu" src="/youtube/icons/hamburger-menu.svg">
                <div class="youtube-container">
                    <img class="youtube-logo" src="/youtube/icons/youtube-logo.svg">
                    <div class="tooltip">Youtube</div>
                </div>
            </div>
            <div class="middle-section">
                <input class="search-bar" type="text" placeholder="Search">
                <button class="search-button">
                    <img class="search-icon" src="/youtube/icons/search.svg">
                    <div class="tooltip">Search</div>
                </button>
                <button class="voice-search-button">
                    <img class="voice-search-icon" src="/youtube/icons/voice-search-icon.svg">
                    <div class="tooltip">Search with your voice</div>
                </button>
            </div>
            <div class="right-section">
                <div class="upload-icon-container">
                    <img class="upload-icon" src="/youtube/icons/upload.svg">
                    <div class="tooltip">Create</div>
                </div>
                <div class="apps-container">
                    <img class="youtube-apps-icon" src="/youtube/icons/youtube-apps.svg">
                    <div class="tooltip">Apps</div>
                </div>
                <div class="notifications-icon-container">
                    <img class="notifications-icon" src="/youtube/icons/notifications.svg">
                    <div class="notifications-count">3</div>
                    <div class="tooltip">Notifications</div>
                </div>
                <div class="profile-container">
                    <img class="current-user-picture" src="/youtube/channel-pictures/my-channel.jpeg">
                    <div class="tooltip">Profile</div>
                </div>
            </div>
        </div>
    </body>
</html>
